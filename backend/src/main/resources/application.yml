# Toutes les valeurs sensibles proviennent de variables d'environnement.
# En local, elles sont lues depuis backend/.env (voir .env.example, jamais commité).
spring:
  application:
    name: lisa-cosmetique-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Supabase PostgreSQL (session pooler ou connexion directe, SSL obligatoire)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase limite le nombre de connexions : rester sobre.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Flyway ouvre une seconde connexion pendant les migrations : le pool doit
      # en autoriser au moins deux. Délai large car Supabase est distant.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré exclusivement par Flyway.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Création du premier compte ADMIN (uniquement s'il n'existe pas déjà).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Supabase Storage (bucket privé, accès par URLs signées)
  storage:
    supabase:
      # Stockage désactivé tant que SUPABASE_SECRET_KEY est vide.
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:lisa-cosmetique}
      signed-url-ttl: ${SUPABASE_SIGNED_URL_TTL:15m}
